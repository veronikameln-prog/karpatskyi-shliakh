# Netlify збирає сайт сам після кожного push у main (репозиторій підключено в app.netlify.com).
# Google Analytics: змінна GA_ID (G-XXXXXXXXXX) у Project configuration → Environment variables;
# без неї сайт збирається без лічильника. Сторінку 404.html Netlify підхоплює сам.

[build]
  command = "npm run build && npm run dist"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
