# Netlify збирає сайт сам після кожного push у main (репозиторій підключено в app.netlify.com).
# Google Analytics: тег Google GTM-5R2XLRNB вбудовано в scripts/build-html.mjs; змінна GA_ID тут (Environment variables) його замінює;
# порожня GA_ID — сайт без лічильника. Сторінку 404.html Netlify підхоплює сам.

[build]
  command = "npm run build && npm run dist"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
