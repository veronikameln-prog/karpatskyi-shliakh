# CI: кожен push і pull request у main проходить автотести, збірку й перевірку посилань.
# Публікує сайт сам Netlify (підключений до цього репозиторію): після push у main він збирає
# сайт за налаштуваннями з netlify.toml і викладає на https://karpatskyi-shliakh.netlify.app.
# Якщо перевірки тут червоні — це сигнал, що зламаний код не варто зливати в main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тести й збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Автотести конструктора й форми
        run: npm test
      - name: Збірка сторінок і CSS
        run: npm run build
        env:
          GA_ID: ${{ vars.GA_ID }} # Google Analytics (Settings → Variables); порожній — без лічильника
      - name: Перевірка посилань, зображень і словників
        run: npm run check
      - name: Тека для публікації
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
