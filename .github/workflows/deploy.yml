# CI/CD: кожен push у main запускає автотести й збірку, а після успіху публікує сайт на Netlify.
# Для pull request виконуються лише перевірки — без публікації.
#
# Секрети репозиторію (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN — персональний токен Netlify
#   NETLIFY_SITE_ID    — ідентифікатор сайту (Site configuration → Site ID)
# Змінна репозиторію (вкладка Variables):
#   GA_ID              — ідентифікатор потоку Google Analytics 4 (G-XXXXXXXXXX)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тести й збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Автотести конструктора й форми
        run: npm test
      - name: Збірка сторінок і CSS
        run: npm run build
        env:
          GA_ID: ${{ vars.GA_ID }} # ідентифікатор Google Analytics (Settings → Variables); порожній — без лічильника
      - name: Перевірка посилань, зображень і словників
        run: npm run check
      - name: Тека для публікації
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    name: Публікація на Netlify
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Deploy
        run: npx --yes netlify-cli@17 deploy --prod --dir=_site --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
