<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#F3F5F1">
  <link rel="canonical" href="{{siteUrl}}/{{file}}">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <!-- Open Graph: картка посилання в месенджерах і соцмережах -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:site_name" content="Карпатський шлях">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{siteUrl}}/{{file}}">
  <meta property="og:image" content="{{siteUrl}}/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Тема ставиться до відмальовки сторінки, щоб не було «спалаху» -->
  <script>
    document.documentElement.classList.add('js');
    try {
      var t = localStorage.getItem('ks-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:wght@600;700&amp;display=swap">
{{libsCss}}  <link rel="stylesheet" href="css/main.css">
</head>
