<body>
  <a class="skip-link" href="#main">Перейти до змісту</a>

  <!-- Шапка-«капсула»: плаває над сторінкою, на головній — поверх фото героя -->
  <header class="sticky top-0 z-40 px-3 pt-3 md:px-6 md:pt-4">
    <div class="mx-auto flex h-16 max-w-site items-center justify-between gap-2 rounded-full border border-white/60 bg-surface/85 pl-4 pr-2 sm:gap-4 sm:pl-5 sm:pr-2.5 shadow-[0_8px_30px_-12px_rgb(22_52_40/0.25)] backdrop-blur-md dark:border-line md:pl-7 md:pr-3">
      <a href="index.html" class="flex min-w-0 items-center gap-2 sm:gap-2.5 [&_.logo]:h-8 sm:[&_.logo]:h-9 md:[&_.logo]:h-10" aria-label="Карпатський шлях — на головну">
        {{logo}}
        <span class="font-serif text-[0.95rem] font-bold leading-[1.05] text-heading sm:text-[1.05rem] md:text-lg">Карпатський<br><em class="font-semibold">Шлях</em></span>
      </a>

      <nav aria-label="Головне меню" class="hidden xl:block">
        <ul class="flex items-center gap-1">
          <li><a class="nav-link" href="routes.html" data-nav="routes">Маршрути</a></li>
          <li><a class="nav-link" href="regions.html" data-nav="regions">Регіони</a></li>
          <li><a class="nav-link" href="planner.html" data-nav="planner">Конструктор походу</a></li>
          <li><a class="nav-link" href="tips.html" data-nav="tips">Поради</a></li>
          <li><a class="nav-link" href="about.html" data-nav="about">Про нас</a></li>
        </ul>
      </nav>

      <div class="flex items-center gap-1.5">
        <a href="routes.html" class="hidden h-10 w-10 place-items-center rounded-full text-heading transition-colors hover:bg-surface-2 sm:grid" aria-label="Пошук маршруту">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </a>
        <span class="mx-1 hidden h-6 w-px bg-line sm:block" aria-hidden="true"></span>
        <button type="button" data-theme-toggle aria-pressed="false" aria-label="Нічна тема"
          class="grid h-10 w-10 place-items-center rounded-full text-heading transition-colors hover:bg-surface-2">
          <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 13.5A8.5 8.5 0 1 1 10.5 3a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
          <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <!-- Перемикач мови: вибір зберігається в localStorage, переклад підставляє src/js/i18n.js -->
        <div class="relative hidden sm:block">
          <button type="button" data-lang-toggle aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu" aria-label="Мова сайту"
            class="inline-flex h-10 items-center gap-1 rounded-full px-3 text-sm font-medium text-heading transition-colors hover:bg-surface-2">
            <span data-lang-current translate="no">UK</span>
            <svg class="h-3.5 w-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul id="lang-menu" class="lang-menu" translate="no" hidden>
            <li><button type="button" class="lang-option" data-lang="uk" lang="uk">Українська</button></li>
            <li><button type="button" class="lang-option" data-lang="en" lang="en">English</button></li>
            <li><button type="button" class="lang-option" data-lang="pl" lang="pl">Polski</button></li>
          </ul>
        </div>
        <a href="planner.html" class="btn-primary btn-sm ml-1 hidden whitespace-nowrap sm:inline-flex">Склади похід</a>
        <button type="button" data-menu-toggle aria-controls="mobile-menu" aria-expanded="false" aria-label="Відкрити меню"
          class="grid h-10 w-10 place-items-center rounded-full text-heading hover:bg-surface-2 xl:hidden">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>

    <nav id="mobile-menu" aria-label="Мобільне меню" class="mx-auto mt-2 max-w-site rounded-3xl border border-line bg-surface p-3 shadow-lg xl:hidden" hidden>
      <ul class="flex flex-col gap-1">
        <li><a class="nav-link block text-base" href="index.html" data-nav="home">Головна</a></li>
        <li><a class="nav-link block text-base" href="routes.html" data-nav="routes">Маршрути</a></li>
        <li><a class="nav-link block text-base" href="regions.html" data-nav="regions">Регіони</a></li>
        <li><a class="nav-link block text-base" href="planner.html" data-nav="planner">Конструктор походу</a></li>
        <li><a class="nav-link block text-base" href="tips.html" data-nav="tips">Поради</a></li>
        <li><a class="nav-link block text-base" href="about.html" data-nav="about">Про нас</a></li>
        <li class="pt-2 sm:hidden"><a class="btn-primary w-full" href="planner.html">Склади похід</a></li>
        <li class="flex gap-2 pt-2 sm:hidden" translate="no">
          <button type="button" class="lang-option flex-1 justify-center border border-line" data-lang="uk" lang="uk">UK</button>
          <button type="button" class="lang-option flex-1 justify-center border border-line" data-lang="en" lang="en">EN</button>
          <button type="button" class="lang-option flex-1 justify-center border border-line" data-lang="pl" lang="pl">PL</button>
        </li>
      </ul>
    </nav>
  </header>
